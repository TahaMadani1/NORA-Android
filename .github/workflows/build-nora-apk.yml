name: Compiler NORA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
     - name: Installer Android 34
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager introuvable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extraire NORA
        run: |
          mkdir android-project
          unzip NORA_AndroidBuild_Projet_Corrige.zip -d android-project

      - name: Compiler APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NORA-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
